name: ${COMPOSE_PROJECT_NAME:-azurekiln-moderation}

services:
  moderation:
    image: ${MODERATION_IMAGE:?Set a tested published image tag or digest}
    container_name: ${COMPOSE_PROJECT_NAME:-azurekiln-moderation}-moderation
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOST: 0.0.0.0
      PORT: "4310"
      MODERATION_DB_PATH: /app/var/moderation.sqlite
      MODERATION_APPS_JSON: ${MODERATION_APPS_JSON:?Set app credentials in a protected environment file}
    ports:
      - "127.0.0.1:${MODERATION_PORT:-4310}:4310"
    volumes:
      - moderation-data:/app/var
    tmpfs:
      - /tmp:size=16m,mode=1777
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: ${COMPOSE_PROJECT_NAME:-azurekiln-moderation}
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    image: nickfedor/watchtower:1.23.2
    container_name: ${COMPOSE_PROJECT_NAME:-azurekiln-moderation}-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: ${COMPOSE_PROJECT_NAME:-azurekiln-moderation}
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-600}
      WATCHTOWER_CLEANUP: "true"
    command:
      - ${COMPOSE_PROJECT_NAME:-azurekiln-moderation}-moderation
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: ${COMPOSE_PROJECT_NAME:-azurekiln-moderation}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  moderation-data:
    name: ${MODERATION_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-azurekiln-moderation}-data}
